name: CI

# Every gate listed in `_AI_CONTEXT/08_TESTING.md`. Three jobs rather than one
# so a red run says which kind of thing broke without opening the log: static
# checks, the test suite against a real Postgres, or a new advisory against a
# dependency.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    env:
      # `drizzle-kit generate` reads the config, which reads this. It compares
      # the schema against the snapshot in drizzle/meta and never connects, so
      # the value only has to parse.
      DATABASE_URL: postgres://tp:tp@127.0.0.1:5432/tp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm 10 cannot install this lockfile: eslint pins ajv 6 and `table`
      # pins ajv 8, and its `ci` refuses the two at different depths. npm 11 can,
      # and the committed lockfile is generated by it.
      - run: npm install -g npm@11
      - run: npm ci

      # No `any` in a server module. Blocking, per 01_RULES.md.
      - name: Types
        run: npm run typecheck

      # The delete ban, the app → server import boundary, and the directional
      # Tailwind utility ban.
      - name: ESLint
        run: npm run lint

      # The directional-property ban in CSS.
      - name: Stylelint
        run: npm run lint:css

      # Item 12: every key in the English catalogue exists in French and
      # Arabic. A missing one renders as the key itself on a live page.
      - name: Message key parity
        run: npm run check:i18n

      # No middleware.ts, nothing uploaded under public/, no committed .env,
      # migrations present.
      - name: Invariants
        run: npm run check:invariants

      # A schema change that exists only in TypeScript applies nowhere. If
      # generate produces a diff, the migration was never committed.
      - name: Migrations are committed
        run: npm run check:migrations

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as production and as docker-compose.dev.yml. The
        # concurrency tests assert real row-lock behaviour, so they need a real
        # Postgres rather than a stub.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tp
          POSTGRES_PASSWORD: tp
          POSTGRES_DB: tp_test
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tp -d tp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite refuses to run without this and points DATABASE_URL at it, so
      # nothing can touch a development database by accident.
      TEST_DATABASE_URL: postgres://tp:tp@127.0.0.1:5432/tp_test
      # Outside the web root, always. The resource route tests write real files
      # here and stream them back.
      STORAGE_ROOT: ${{ github.workspace }}/.storage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm 10 cannot install this lockfile: eslint pins ajv 6 and `table`
      # pins ajv 8, and its `ci` refuses the two at different depths. npm 11 can,
      # and the committed lockfile is generated by it.
      - run: npm install -g npm@11
      - run: npm ci

      # Migrations are applied by the suite itself, on first use of the
      # database, so there is no separate migrate step to fall out of sync.
      - name: Vitest
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm 10 cannot install this lockfile: eslint pins ajv 6 and `table`
      # pins ajv 8, and its `ci` refuses the two at different depths. npm 11 can,
      # and the committed lockfile is generated by it.
      - run: npm install -g npm@11
      - run: npm ci

      # Runtime dependencies, blocking at high and critical.
      #
      # Not at moderate: `--omit=dev` does not currently exclude drizzle-kit,
      # and drizzle-kit pins an esbuild with a moderate dev-server advisory
      # that has no fix short of a breaking upgrade. Blocking there would mean
      # a permanently red pipeline for a tool that ships nothing to a student's
      # phone, and a red pipeline nobody can fix is a pipeline people stop
      # reading. Revisit when drizzle-kit moves.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
